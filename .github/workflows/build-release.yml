name: Build WordPress release ZIP
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag, e.g. v5.0.0-beta.6'
        required: false
        default: ''
  pull_request:
    branches:
      - main
  push:
    branches:
      - ua-parser-5.0-rebuild
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: ua-parser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate PHP and JavaScript
        run: |
          find . -path './.git' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          node --check assets/admin.js
          node --check assets/advanced.js
      - name: Prepare canonical plugin folder
        run: |
          mkdir -p dist/ua-parser
          cp ua-parser.php readme.txt dist/ua-parser/
          cp -R assets includes dist/ua-parser/
      - name: Create installable ZIP
        run: cd dist && zip -r ../ua-parser.zip ua-parser
      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-parser-installable
          path: ua-parser.zip
          if-no-files-found: error
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/ua-parser-5.0-rebuild' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v5.0.0-beta.6' }}
          target_commitish: ua-parser-5.0-rebuild
          prerelease: true
          overwrite_files: true
          files: ua-parser.zip
          generate_release_notes: true
